# ====== LA FONCTION « rappels », DÉPLOYÉE PAR GITHUB ======
# « Le code pour les Edge Functions ne se colle pas. » (18/10/2026) — plus
# rien à coller : à chaque changement de notifications/rappels.ts sur main,
# GitHub pose lui-même le code dans Supabase, sans « Verify JWT » (la fonction
# garde sa porte elle-même, voir notifications/LISEZMOI.md), puis vérifie la
# fonction en ligne comme le jeu la voit (notifications/verifier.js).
#
# Une seule chose à faire, une fois : le secret SUPABASE_ACCESS_TOKEN
# (Settings → Secrets and variables → Actions), un jeton d'accès créé sur
# supabase.com/dashboard/account/tokens. Il ne vit que là : jamais dans le
# dépôt, jamais dans une conversation, masqué dans les journaux. Sans lui, rien
# ne part, et la page du déploiement le dit sans passer au rouge.
#
# À la main : Actions → « Fonction rappels » → Run workflow.
name: Fonction rappels

on:
  push:
    branches: [main]
    paths:
      - notifications/rappels.ts
      - notifications/verifier.js
      - .github/workflows/rappels.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonction-rappels
  cancel-in-progress: false

jobs:
  deployer:
    name: Déployer et vérifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJET: chyuckryusxzssezesuw
      # L'outil Supabase, figé et vérifié à l'octet près : l'empreinte est
      # celle que publie checksums.txt de la même version.
      CLI_VERSION: 2.119.0
      CLI_SHA256: bf1c3ae93be98533eb8a3105dbf4564bd0b2d9dc24690d8a920f980ef975c1b4
    steps:
      - name: Le jeton est-il posé ?
        id: jeton
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "pret=non" >> "$GITHUB_OUTPUT"
            m="Rien n'a été déployé : le secret SUPABASE_ACCESS_TOKEN n'est pas encore posé (notifications/LISEZMOI.md, étape 2)."
            echo "::notice::$m"
            printf '### En attente du jeton\n\n%s\n' "$m" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Le dépôt, à ce commit
        if: steps.jeton.outputs.pret == 'oui'
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: L'outil Supabase
        if: steps.jeton.outputs.pret == 'oui'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cli.tgz" \
            "https://github.com/supabase/cli/releases/download/v$CLI_VERSION/supabase_${CLI_VERSION}_linux_amd64.tar.gz"
          echo "$CLI_SHA256  $RUNNER_TEMP/cli.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cli"
          tar -xzf "$RUNNER_TEMP/cli.tgz" -C "$RUNNER_TEMP/cli"
          echo "$RUNNER_TEMP/cli" >> "$GITHUB_PATH"

      - name: Déployer « rappels », sans Verify JWT
        if: steps.jeton.outputs.pret == 'oui'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Le code et « Verify JWT » changent d'un même geste : l'ancienne
          # fonction, qui ne vérifie rien, ne se retrouve jamais sans porte.
          P="$RUNNER_TEMP/projet"
          mkdir -p "$P/supabase/functions/rappels"
          cp notifications/rappels.ts "$P/supabase/functions/rappels/index.ts"
          if ! supabase functions deploy rappels --workdir "$P" --project-ref "$PROJET" --no-verify-jwt --use-api 2>&1 | tee "$RUNNER_TEMP/deploiement.txt"; then
            {
              printf '### ❌ Le déploiement a échoué\n\n'
              if grep -q "Invalid access token" "$RUNNER_TEMP/deploiement.txt"; then
                printf -- "- Supabase refuse le jeton : recrée-le sur supabase.com/dashboard/account/tokens, puis remplace le secret SUPABASE_ACCESS_TOKEN.\n"
              fi
              printf '\n```\n%s\n```\n' "$(tail -n 5 "$RUNNER_TEMP/deploiement.txt")"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Vérifier la fonction en ligne
        if: steps.jeton.outputs.pret == 'oui'
        run: node notifications/verifier.js
